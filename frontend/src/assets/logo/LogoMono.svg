<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SoloSaathi Circle Monochrome Logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;display=swap');
      .ss-mono-title {
        font-family: 'Baloo 2', cursive, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 19.5px;
        letter-spacing: 0.2px;
        fill: #F3EDE0;
      }
      .ss-mono-sub {
        font-family: 'Baloo 2', cursive, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 3.2px;
        fill: #F3EDE0;
        opacity: 0.85;
      }
    </style>
  </defs>

  <!-- Left: Logo Mark (46x46 at x=5, y=5) -->
  <g transform="translate(5, 5) scale(0.46)">
    <!-- 1. Rhythmic Orbit Track -->
    <circle
      cx="50"
      cy="50"
      r="32"
      stroke="#F3EDE0"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-dasharray="16 8"
      opacity="0.9"
    />

    <!-- 2. Central Sacred Diya Flame -->
    <path
      d="M50 42 C50 47 47 50 42 50 C47 50 50 53 50 58 C50 53 53 50 58 50 C53 50 50 47 50 42 Z"
      fill="#F3EDE0"
    />
    <circle cx="50" cy="50" r="2.2" fill="#14101F" />

    <!-- 3. Welcoming Hand Arc -->
    <path
      d="M51 18 C62 19 70 24 76 33"
      stroke="#F3EDE0"
      stroke-width="3.8"
      stroke-linecap="round"
    />

    <!-- 4. 7 Companion Dancers in the Circle -->
    <circle cx="82" cy="50" r="5.2" fill="#F3EDE0" />
    <circle cx="73" cy="73" r="5.2" fill="#F3EDE0" />
    <circle cx="50" cy="82" r="5.2" fill="#F3EDE0" />
    <circle cx="27" cy="73" r="5.2" fill="#F3EDE0" />
    <circle cx="18" cy="50" r="5.2" fill="#F3EDE0" />
    <circle cx="27" cy="27" r="5.2" fill="#F3EDE0" />
    <circle cx="50" cy="18" r="5.2" fill="#F3EDE0" />

    <!-- 5. The Solo Saathi Newcomer -->
    <circle
      cx="74"
      cy="26"
      r="8.8"
      stroke="#F3EDE0"
      stroke-width="1.8"
      stroke-dasharray="2.5 2"
    />
    <circle cx="74" cy="26" r="6.2" fill="#F3EDE0" />
    <circle cx="72.2" cy="24.2" r="2" fill="#14101F" />
  </g>

  <!-- Right: Wordmark -->
  <text x="60" y="27" class="ss-mono-title">
    Solo Saathi
  </text>
  <text x="61" y="44" class="ss-mono-sub">
    CIRCLE
  </text>
</svg>
