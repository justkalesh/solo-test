<svg width="100" height="100" viewBox="0 0 100 100" fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="SoloSaathi Circle Logo Mark">
  <defs>
    <!-- Orbit ring gradient: Gold → Magenta sweep -->
    <linearGradient id="ss_m_ring" x1="18" y1="18" x2="82" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F5B301" />
      <stop offset="40%"  stop-color="#E3A542" />
      <stop offset="75%"  stop-color="#DB2777" />
      <stop offset="100%" stop-color="#9D2FB5" />
    </linearGradient>
    <!-- Solo newcomer fill: bright gold -->
    <linearGradient id="ss_m_solo" x1="67" y1="19" x2="84" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFF9ED" />
      <stop offset="50%"  stop-color="#F5B301" />
      <stop offset="100%" stop-color="#E3A542" />
    </linearGradient>
  </defs>

  <!-- 1. Orbit track: thin continuous gradient ring -->
  <circle cx="50" cy="50" r="32"
    stroke="url(#ss_m_ring)"
    stroke-width="2.2"
    opacity="0.7" />

  <!-- 2. Welcoming arc: solid stroke from North node toward Solo position -->
  <path d="M 50 18 C 60 17 69 21 74 28"
    stroke="#F5B301"
    stroke-width="3.8"
    stroke-linecap="round" />

  <!-- 3. Seven companion dancers (r=4.8) -->
  <!-- 0°   East       --> <circle cx="82" cy="50" r="4.8" fill="#DB2777" />
  <!-- 45°  South-East --> <circle cx="73" cy="73" r="4.8" fill="#DB2777" />
  <!-- 90°  South      --> <circle cx="50" cy="82" r="4.8" fill="#C0267C" />
  <!-- 135° South-West --> <circle cx="27" cy="73" r="4.8" fill="#9D2FB5" />
  <!-- 180° West       --> <circle cx="18" cy="50" r="4.8" fill="#E3A542" />
  <!-- 225° North-West --> <circle cx="27" cy="27" r="4.8" fill="#E3A542" />
  <!-- 270° North      --> <circle cx="50" cy="18" r="4.8" fill="#F5B301" />

  <!-- 4. The Solo Saathi: ~315° top-right, r=8.5 (77% larger than companions) -->
  <!-- Solid halo ring (replaces dashed — readable at 32px) -->
  <circle cx="74" cy="26" r="11.2"
    stroke="#F5B301"
    stroke-width="2"
    opacity="0.55" />
  <!-- Main solo node -->
  <circle cx="74" cy="26" r="8.5" fill="url(#ss_m_solo)" />
  <!-- White highlight punch -->
  <circle cx="71.8" cy="23.8" r="2.4" fill="#FFFFFF" opacity="0.9" />
</svg>
